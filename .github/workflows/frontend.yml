name: Frontend

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Frontend CI & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck
        working-directory: ./frontend
        run: npx tsc -b

      - name: Lint
        working-directory: ./frontend
        run: npx oxlint --deny-warnings .

      - name: Format check
        working-directory: ./frontend
        run: npx prettier --check .

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://api-cvmc.yurinogueira.dev.br
          VITE_BASE_PATH: /
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy-gh-pages:
    name: Deploy to GitHub Pages
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: cvmc.yurinogueira.dev.br

  build-android-apk:
    name: Build Android APK
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ./frontend/dist

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > ./frontend/android/app/google-services.json
            echo "google-services.json injected from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON secret not set; skipping google-services.json injection."
          fi

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/cvmc-release-key.jks
            echo "Release keystore decoded to /tmp/cvmc-release-key.jks."
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set; release artifacts will remain unsigned."
          fi

      - name: Build Android Debug APK & Signed Release AAB/APK
        working-directory: ./frontend/android
        env:
          CVMC_RELEASE_STORE_FILE: /tmp/cvmc-release-key.jks
          CVMC_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CVMC_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CVMC_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug bundleRelease assembleRelease --no-daemon

      - name: Cleanup Release Keystore
        if: always()
        run: rm -f /tmp/cvmc-release-key.jks

      - name: Upload Android Release AAB (Google Play Store)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload Android Release APK (Signed Direct Install)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

