name: Backend

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: manual-approval
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Build Docker image
        run: docker build -t cvmc-backend:ci .
