services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - mongo
    environment:
      PORT: ${PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-cvmc_dev_jwt_access_secret_key_at_least_32_chars!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cvmc_dev_jwt_refresh_secret_key_at_least_32_chars!}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-cvmc}
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/uploads}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FIPE_API_TOKEN: ${FIPE_API_TOKEN:-}
      FIPE_BASE_URL: ${FIPE_BASE_URL:-https://fipe.parallelum.com.br/api/v2}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_BASE_PATH: /
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  mongo_data:
  backend_uploads:
  frontend_node_modules: