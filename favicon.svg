<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#4C92FC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Speedometer Arch / Performance Gauge -->
  <path d="M120 330 C120 200, 220 120, 360 140 C410 150, 440 180, 440 220" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.9" />
  
  <!-- Gauge needle dot & line -->
  <circle cx="256" cy="330" r="22" fill="#38BDF8" filter="url(#glow)" />
  <line x1="256" y1="330" x2="350" y2="210" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" />

  <!-- Modern 3/4 Car silhouette -->
  <ellipse cx="256" cy="400" rx="170" ry="24" fill="#000000" opacity="0.45" />

  <!-- Car body upper silhouette -->
  <path d="M120 380 C130 350, 160 340, 200 330 L245 285 C260 270, 310 270, 360 290 L400 335 C420 345, 430 365, 430 385 L120 385 Z" fill="url(#primaryGrad)" />

  <!-- Car windshield / windows -->
  <path d="M215 328 L255 288 C265 278, 300 278, 345 294 L375 328 Z" fill="#0F172A" opacity="0.85" />
  
  <!-- Headlight beam -->
  <path d="M400 350 L460 360 L450 375 L395 365 Z" fill="#38BDF8" opacity="0.9" filter="url(#glow)" />

  <!-- Front wheel -->
  <circle cx="365" cy="385" r="32" fill="#0F172A" stroke="#38BDF8" stroke-width="8" />
  <circle cx="365" cy="385" r="14" fill="#64748B" />

  <!-- Rear wheel -->
  <circle cx="175" cy="385" r="32" fill="#0F172A" stroke="#38BDF8" stroke-width="8" />
  <circle cx="175" cy="385" r="14" fill="#64748B" />
</svg>
