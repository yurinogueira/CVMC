basePath: /
definitions:
  handlers.CreateCarRequest:
    properties:
      fipeCode:
        example: 005487-9
        type: string
      fipePrice:
        example: R$ 150.000,00
        type: string
      fuel:
        example: Gasolina
        type: string
      imageUrl:
        example: https://images.unsplash.com/photo-1590362891988-39cb01f6ec08
        type: string
      lastMileage:
        example: 32000
        type: integer
      manufacturer:
        example: Honda
        type: string
      model:
        example: Civic Touring
        type: string
      name:
        example: Meu Civic
        type: string
      vehicleType:
        example: cars
        type: string
      yearManufacture:
        example: 2023
        type: integer
      yearModel:
        example: 2024
        type: integer
    type: object
  handlers.CreateMaintenanceRequest:
    properties:
      date:
        example: "2026-08-23T00:00:00Z"
        type: string
      description:
        example: Óleo 0W20 Sintético + Filtro original
        type: string
      mileage:
        example: 32000
        type: integer
      title:
        example: Troca de Óleo e Filtro
        type: string
    type: object
  handlers.ForgotPasswordRequest:
    properties:
      email:
        example: yuri@cvmc.com
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: yuri@cvmc.com
        type: string
      password:
        example: senha12345
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        example: yuri@cvmc.com
        type: string
      name:
        example: Yuri Nogueira
        type: string
      password:
        example: senha12345
        type: string
    type: object
  handlers.ResetPasswordRequest:
    properties:
      newPassword:
        example: novaSenha12345
        type: string
      token:
        example: a1b2c3d4e5f6...
        type: string
    type: object
  handlers.ShareCarRequest:
    properties:
      email:
        example: co-motorista@cvmc.com
        type: string
    type: object
  handlers.UpdateCarRequest:
    properties:
      fipeCode:
        example: 005487-9
        type: string
      fipePrice:
        example: R$ 150.000,00
        type: string
      fuel:
        example: Gasolina
        type: string
      imageUrl:
        example: https://images.unsplash.com/photo-1590362891988-39cb01f6ec08
        type: string
      lastMileage:
        example: 35000
        type: integer
      manufacturer:
        example: Honda
        type: string
      model:
        example: Civic Touring
        type: string
      name:
        example: Meu Civic
        type: string
      vehicleType:
        example: cars
        type: string
      yearManufacture:
        example: 2023
        type: integer
      yearModel:
        example: 2024
        type: integer
    type: object
  handlers.UpdateMaintenanceRequest:
    properties:
      date:
        example: "2026-08-23T00:00:00Z"
        type: string
      description:
        example: Óleo 0W20 Sintético + Filtro original
        type: string
      mileage:
        example: 32000
        type: integer
      title:
        example: Troca de Óleo e Filtro
        type: string
    type: object
  handlers.UpdatePasswordRequest:
    properties:
      currentPassword:
        example: senhaAntiga123
        type: string
      newPassword:
        example: senhaNova12345
        type: string
    type: object
  handlers.UpdateProfileRequest:
    properties:
      name:
        example: Yuri Nogueira
        type: string
    type: object
  handlers.VerifyEmailRequest:
    properties:
      token:
        example: a1b2c3d4e5f6...
        type: string
    type: object
  httpx.ErrorEnvelope:
    properties:
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  httpx.SuccessEnvelope:
    properties:
      data: {}
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: suporte@cvmc.com
    name: Suporte CVMC
  description: API REST para gestão inteligente de veículos, revisões e manutenções
    do CVMC (Como Vai Meu Carro).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: CVMC API
  version: "1.0"
paths:
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Envia e-mail com instruções e link para redefinir senha sem enumeração
        de usuários
      parameters:
      - description: E-mail cadastrado
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Solicitar recuperação de senha
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Autentica com e-mail e senha, seta cookies httpOnly com tokens
        e retorna dados do usuário
      parameters:
      - description: Credenciais de acesso
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Autenticação de usuário
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Remove os cookies de autenticação
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
      summary: Encerrar sessão
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Retorna as informações do usuário atual com base no cookie de acesso
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Dados do usuário autenticado
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Gera um novo par de tokens a partir do cookie de refresh
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Renovar token de acesso
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Cria uma nova conta de usuário, envia e-mail de confirmação, seta
        cookies httpOnly com tokens e retorna dados do usuário
      parameters:
      - description: Dados de cadastro
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Cadastro de novo usuário
      tags:
      - Auth
  /api/v1/auth/resend-verification:
    post:
      description: Reenvia o e-mail de confirmação para o usuário autenticado
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Reenviar e-mail de confirmação
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Redefine a senha do usuário utilizando o token recebido por e-mail
      parameters:
      - description: Token e nova senha
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Redefinir senha
      tags:
      - Auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Valida o e-mail do usuário utilizando o token de uso único recebido
      parameters:
      - description: Token de validação
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Validar endereço de e-mail
      tags:
      - Auth
  /api/v1/cars:
    get:
      description: Retorna todos os veículos pertencentes ou compartilhados com o
        usuário autenticado
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Listar veículos
      tags:
      - Cars
    post:
      consumes:
      - application/json
      description: Registra um novo veículo associado à conta do usuário autenticado
      parameters:
      - description: Dados do veículo
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateCarRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Cadastrar novo veículo
      tags:
      - Cars
  /api/v1/cars/{id}:
    delete:
      description: Remove o veículo do sistema
      parameters:
      - description: ID do veículo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Excluir veículo
      tags:
      - Cars
    get:
      description: Retorna os dados completos de um veículo específico pelo ID
      parameters:
      - description: ID do veículo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Obter detalhes do veículo
      tags:
      - Cars
    put:
      consumes:
      - application/json
      description: Atualiza os dados cadastrais e quilometragem do veículo
      parameters:
      - description: ID do veículo
        in: path
        name: id
        required: true
        type: string
      - description: Dados atualizados
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateCarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Atualizar veículo
      tags:
      - Cars
  /api/v1/cars/{id}/maintenances:
    get:
      description: Retorna o histórico cronológico de manutenções de um veículo
      parameters:
      - description: ID do veículo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Listar manutenções do veículo
      tags:
      - Maintenances
    post:
      consumes:
      - application/json
      description: Registra um novo registro de revisão ou manutenção para o veículo
        especificado
      parameters:
      - description: ID do veículo
        in: path
        name: id
        required: true
        type: string
      - description: Dados da manutenção
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateMaintenanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Cadastrar manutenção
      tags:
      - Maintenances
  /api/v1/cars/{id}/share:
    post:
      consumes:
      - application/json
      description: Concede permissão de acesso ao veículo para outro usuário através
        do e-mail
      parameters:
      - description: ID do veículo
        in: path
        name: id
        required: true
        type: string
      - description: E-mail do usuário
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ShareCarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Compartilhar veículo
      tags:
      - Cars
  /api/v1/cars/{id}/share/{userID}:
    delete:
      description: Revoga o acesso de um usuário ao veículo
      parameters:
      - description: ID do veículo
        in: path
        name: id
        required: true
        type: string
      - description: ID do usuário a desvincular
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Remover compartilhamento
      tags:
      - Cars
  /api/v1/fipe/{vehicleType}/brands:
    get:
      description: Retorna a lista de marcas para um tipo de veículo com cache multinível
        no MongoDB
      parameters:
      - description: Tipo de veículo (cars, motorcycles, trucks)
        in: path
        name: vehicleType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Listar marcas de veículos (Fipe)
      tags:
      - Fipe
  /api/v1/fipe/{vehicleType}/brands/{brandId}/models:
    get:
      description: Retorna a lista de modelos de uma determinada marca com cache multinível
        no MongoDB
      parameters:
      - description: Tipo de veículo (cars, motorcycles, trucks)
        in: path
        name: vehicleType
        required: true
        type: string
      - description: Código da marca Fipe
        in: path
        name: brandId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Listar modelos de uma marca (Fipe)
      tags:
      - Fipe
  /api/v1/fipe/{vehicleType}/brands/{brandId}/models/{modelId}/years:
    get:
      description: Retorna a lista de anos/versões de um determinado modelo com cache
        no MongoDB
      parameters:
      - description: Tipo de veículo (cars, motorcycles, trucks)
        in: path
        name: vehicleType
        required: true
        type: string
      - description: Código da marca Fipe
        in: path
        name: brandId
        required: true
        type: string
      - description: Código do modelo Fipe
        in: path
        name: modelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Listar anos e versões de um modelo (Fipe)
      tags:
      - Fipe
  /api/v1/fipe/{vehicleType}/brands/{brandId}/models/{modelId}/years/{yearId}:
    get:
      description: Retorna os detalhes completos, código Fipe, combustível e preço
        de mercado atualizado
      parameters:
      - description: Tipo de veículo (cars, motorcycles, trucks)
        in: path
        name: vehicleType
        required: true
        type: string
      - description: Código da marca Fipe
        in: path
        name: brandId
        required: true
        type: string
      - description: Código do modelo Fipe
        in: path
        name: modelId
        required: true
        type: string
      - description: 'Código do ano Fipe (ex: 2023-1)'
        in: path
        name: yearId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Obter detalhes e preço Fipe de um veículo
      tags:
      - Fipe
  /api/v1/maintenances/{maintenanceID}:
    delete:
      description: Remove o registro de manutenção
      parameters:
      - description: ID da manutenção
        in: path
        name: maintenanceID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Excluir manutenção
      tags:
      - Maintenances
    put:
      consumes:
      - application/json
      description: Atualiza dados de uma manutenção existente
      parameters:
      - description: ID da manutenção
        in: path
        name: maintenanceID
        required: true
        type: string
      - description: Dados atualizados
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateMaintenanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Atualizar manutenção
      tags:
      - Maintenances
  /api/v1/user/password:
    put:
      consumes:
      - application/json
      description: Altera a senha do usuário autenticado exigindo a senha atual
      parameters:
      - description: Senha atual e nova senha
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Alterar senha do usuário
      tags:
      - User
  /api/v1/user/profile:
    get:
      description: Retorna os dados completos do usuário, incluindo status de verificação
        de e-mail e consumo de cota de veículos
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Perfil do usuário autenticado
      tags:
      - User
    put:
      consumes:
      - application/json
      description: Atualiza informações do perfil do usuário autenticado (como o nome)
      parameters:
      - description: Dados para atualização
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Atualizar perfil do usuário
      tags:
      - User
  /health:
    get:
      description: Retorna o status geral de saúde da aplicação
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
      summary: Health check
      tags:
      - Health
  /live:
    get:
      description: Verifica se a aplicação está viva em execução
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
      summary: Liveness probe
      tags:
      - Health
  /ready:
    get:
      description: Verifica se a aplicação está pronta para receber tráfego
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.SuccessEnvelope'
      summary: Readiness probe
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: Digite "Bearer " seguido do token JWT obtido no login.
    in: header
    name: Authorization
    type: apiKey
